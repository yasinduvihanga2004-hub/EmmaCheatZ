<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmmaCheatZ - Dashboard</title>
    <style>
        :root {
            --bg-color: #060b19;          /* Deep Dark Blue */
            --panel-bg: #0d1527;        /* Card Dark Blue */
            --accent-blue: #0066ff;      /* Electric Blue */
            --accent-cyan: #00d9ff;      /* Bright Cyan Blue */
            --text-color: #ffffff;
            --text-muted: #768cae;
            --danger: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid rgba(0, 102, 255, 0.3);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(0, 102, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.4);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(4, 9, 22, 0.6);
            border: 1px solid rgba(0, 102, 255, 0.3);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.4);
            transition: opacity 0.3s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }

        /* Dashboard Styles */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 102, 255, 0.25);
            padding-bottom: 10px;
        }

        .status-badge {
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent-cyan);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(0, 217, 255, 0.4);
            box-shadow: 0 0 8px rgba(0, 217, 255, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(4, 9, 22, 0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 102, 255, 0.2);
            text-align: center;
        }

        .stat-box h4 {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stat-box p {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-cyan);
        }

        .logout-btn {
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 51, 102, 0.3);
            box-shadow: none;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: rgba(255, 51, 102, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Section -->
        <div id="loginSection" class="card">
            <h2>EmmaCheatZ Login</h2>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username...">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password...">
            </div>
            <button class="btn" onclick="handleLogin()">Access System</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="card hidden">
            <div class="dashboard-header">
                <h3>EmmaCheatZ Panel</h3>
                <span class="status-badge">ONLINE</span>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <h4>Status</h4>
                    <p>Active</p>
                </div>
                <div class="stat-box">
                    <h4>Security</h4>
                    <p>Protected</p>
                </div>
            </div>
            <div class="input-group">
                <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center;">Welcome back, Commander!</p>
            </div>
            <button class="btn logout-btn" onclick="handleLogout()">Disconnect</button>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if(user.trim() !== "" && pass.trim() !== "") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else {
                alert('Please enter valid credentials!');
            }
        }

        function handleLogout() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
